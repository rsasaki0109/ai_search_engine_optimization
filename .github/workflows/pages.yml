name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type > /tmp/pages-type; then
            if [ "$(cat /tmp/pages-type)" = workflow ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo 'Enable Settings → Pages → Source: GitHub Actions, then re-run this workflow.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: needs.build.outputs.enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
