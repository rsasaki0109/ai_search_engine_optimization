name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/history.js
          node --check static/report.js
          node --check static/batch.js
          node --check static/sitemap.js
          node --check static/demo.js
          node --check pages/pages.js
          node --check pages/analysis-worker.js
      - name: History and report tests
        run: |
          node tests/history.test.cjs
          node tests/report.test.cjs

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty selects Playwright's installed Chromium instead of a system binary.
      CHROMIUM_EXECUTABLE: ''
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - name: Audit history and comparison
        run: python tests/browser_history.py
      - name: Markdown and PDF reports
        run: python tests/browser_report.py
      - name: Batch audits and partial failures
        run: python tests/browser_batch.py

      - name: Build and test GitHub Pages
        run: |
          python tools/build_pages.py
          python tests/browser_pages.py
      - name: Public beta HTTP limits
        run: python tests/browser_beta.py
      - name: Before and after sample demo
        run: python tests/browser_demo.py

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t aeo-check:ci .
      - name: Start and check health and demo
        run: |
          docker run -d --name aeo-check -p 127.0.0.1:8000:8000 aeo-check:ci
          python - <<'PYTEST'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2))['status'] == 'ok'
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Container failed to become healthy')
          result = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/demo', timeout=5))
          assert result['before']['score'] == 30 and result['after']['score'] == 100
          PYTEST
      - name: Container logs
        if: failure()
        run: docker logs aeo-check
