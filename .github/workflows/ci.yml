name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/history.js
          node --check static/report.js
          node --check static/batch.js
      - name: History and report tests
        run: |
          node tests/history.test.cjs
          node tests/report.test.cjs

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty selects Playwright's installed Chromium instead of a system binary.
      CHROMIUM_EXECUTABLE: ''
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - name: Audit history and comparison
        run: python tests/browser_history.py
      - name: Markdown and PDF reports
        run: python tests/browser_report.py
      - name: Batch audits and partial failures
        run: python tests/browser_batch.py
